<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proxmate · Your lab, simplified</title><link rel="stylesheet" href="/static/style.css"><script defer src="/static/app.js"></script><script defer src="/static/wizard.js"></script><script defer src="/static/manage.js"></script><script defer src="/static/lifecycle.js"></script></head>
<body><aside><a class="brand" href="/">p<span>▰</span> proxmate</a><p class="eyebrow">YOUR HOMELAB TOOLKIT</p><nav><button data-view="overview" class="active">◫ Overview</button><button data-view="templates">▧ Templates</button><button data-view="machines">▣ Virtual machines</button><button data-view="ansible">⌘ Ansible</button><button data-view="backups">◷ Backups</button><button data-view="media">▤ ISO library</button><button data-view="jobs">≋ Activity</button><button data-view="tasks">Task library</button><button data-view="credentials">Credentials</button><button data-view="groups">VM groups</button><button data-view="recipes">Recipes</button><button data-view="schedules">Schedules</button><button data-view="versions">Template versions</button><button data-view="recovery">Backup recovery</button></nav><div class="aside-bottom"><a href="/api/docs" target="_blank">API documentation ↗</a><p>Built for your LAN.<br>Powered by Proxmox.</p><button id="logout">Sign out</button></div></aside>
<main><header><span><i id="connection"></i> <span id="connection-label">Connecting to your lab</span></span><button id="refresh">↻ Refresh</button></header><div id="notice" role="status" hidden></div><section id="content"></section></main>
<dialog id="login"><form id="login-form"><div class="logo">p▰</div><h1>Welcome to Proxmate</h1><p>Your lab, with a little less legwork.</p><label>Administrator password<input name="password" type="password" autocomplete="current-password" required autofocus></label><p id="login-error" role="alert"></p><button class="primary">Open my lab →</button><small>Use the password in your .env.admin file.</small></form></dialog>
<dialog id="editor"><form id="action-form"><div class="modal-head"><h2 id="form-title"></h2><button type="button" id="close" aria-label="Close">×</button></div><div id="fields"></div><p id="form-error" role="alert"></p><div class="modal-footer"><span>Runs as a tracked background job</span><button class="primary">Run operation →</button></div></form></dialog>
<dialog id="wizard" aria-labelledby="wizard-title"><form id="wizard-form"><div class="modal-head"><h2 id="wizard-title">Build a machine</h2><button type="button" id="wizard-close" aria-label="Close wizard">Close</button></div><ol id="wizard-steps" aria-label="Provisioning steps"></ol><div id="wizard-fields"></div><p id="wizard-error" role="alert"></p><div class="modal-footer"><button type="button" id="wizard-back">Back</button><button type="button" id="wizard-download" hidden>Download answer file (contains password)</button><button id="wizard-next" class="primary">Continue</button></div></form></dialog><dialog id="manage-dialog" aria-labelledby="manage-title"><form id="manage-form"><div class="modal-head"><h2 id="manage-title"></h2><button type="button" id="manage-close">Close</button></div><div id="manage-fields"></div><p id="manage-error" role="alert"></p><div class="modal-footer"><button id="manage-submit" class="primary">Save</button></div></form></dialog></body></html>

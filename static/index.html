<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proxmate · Machine management</title><link rel="stylesheet" href="/static/style.css" nonce="{{ style_nonce }}"><script defer src="/static/notifications.js"></script><script defer src="/static/app.js"></script><script defer src="/static/wizard.js"></script><script defer src="/static/script-editor.js"></script><script defer src="/static/manage.js"></script><script defer src="/static/lifecycle.js"></script><script defer src="/static/server.js"></script><script defer src="/static/windows.js"></script><script defer src="/static/simple.js"></script><script defer src="/static/guest-operations.js"></script><script defer src="/static/machine.js"></script></head>
<body><a class="skip-link" href="#content">Skip to workspace</a><aside><a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>Proxmate</a><button type="button" id="nav-toggle" aria-expanded="false" aria-controls="workspace-nav">Menu</button><nav id="workspace-nav" aria-label="Workspace"><button data-view="machines" class="active">Operations</button><button data-view="create">Create</button><button data-view="scripts">Script library</button><button data-view="jobs">Progress</button><button data-view="server" class="server-nav">Server</button><details class="advanced-nav"><summary>Advanced</summary><button data-view="overview">Full dashboard</button><button data-view="tasks">All tasks</button><button data-view="credentials">Saved logins</button><button data-view="media">ISO library</button><button data-view="ansible">Full Ansible playbooks</button><button data-view="groups">VM groups</button><button data-view="recipes">Recipes</button><button data-view="backups">Backups</button><button data-view="schedules">Schedules</button><button data-view="versions">Template versions</button><button data-view="recovery">Backup recovery</button></details></nav><div class="aside-bottom"><a href="/api/docs" target="_blank">API documentation ↗</a><button id="logout">Sign out</button></div></aside>
<main><header><span><i id="connection"></i> <span id="connection-label">Checking server connection</span></span><button id="refresh">↻ Refresh</button></header><div id="notice" role="status" hidden></div><section id="content" tabindex="-1"></section></main>
<dialog id="login"><form id="login-form"><span class="brand-mark" aria-hidden="true"></span><h1>Sign in to Proxmate</h1><label>Administrator password<input name="password" type="password" autocomplete="current-password" required autofocus></label><p id="login-error" role="alert"></p><button class="primary">Sign in</button><small>Use the password in your .env.admin file.</small></form></dialog>
<dialog id="editor"><form id="action-form"><div class="modal-head"><h2 id="form-title"></h2><button type="button" id="close" aria-label="Close">×</button></div><div id="fields"></div><p id="form-error" role="alert"></p><div class="modal-footer"><span>Runs as a tracked background job</span><button class="primary">Run operation →</button></div></form></dialog>
<dialog id="wizard" aria-labelledby="wizard-title"><form id="wizard-form"><div class="modal-head"><h2 id="wizard-title">Build a machine</h2><button type="button" id="wizard-close" aria-label="Close wizard">Close</button></div><ol id="wizard-steps" aria-label="Provisioning steps"></ol><div id="wizard-fields"></div><p id="wizard-error" role="alert"></p><div class="modal-footer"><button type="button" id="wizard-back">Back</button><button type="button" id="wizard-download" hidden>Download answer file (contains password)</button><button id="wizard-next" class="primary">Continue</button></div></form></dialog><dialog id="manage-dialog" aria-labelledby="manage-title"><form id="manage-form"><div class="modal-head"><h2 id="manage-title"></h2><button type="button" id="manage-close">Close</button></div><div id="manage-fields"></div><p id="manage-error" role="alert"></p><div class="modal-footer"><button id="manage-submit" class="primary">Save</button></div></form></dialog><dialog id="simple-dialog" aria-labelledby="simple-title"><form id="simple-form"><div class="modal-head"><h2 id="simple-title">Create machines</h2><button type="button" id="simple-close">Close</button></div><ol id="simple-steps" aria-label="Setup steps"></ol><div id="simple-fields"></div><p id="simple-progress" role="status" hidden></p><div class="wizard-feedback"><p id="simple-error" role="alert"></p><button type="button" id="simple-retry-iso" hidden>Retry edition check</button></div><div class="modal-footer"><button type="button" id="simple-back">Back</button><button id="simple-next" class="primary">Continue</button></div></form></dialog><div id="toasts" aria-label="Notifications"></div></body></html>

name: proxmate
services:
  proxmate:
    image: ${PROXMATE_IMAGE:?Choose a released Proxmate image}
    ports:
      - "${PORT:-8088}:8080"
    environment:
      APP_PASSWORD_FILE: /run/secrets/app_password
    secrets:
      - app_password
    volumes:
      - proxmate-data:/data
      - type: bind
        source: ${ISO_PATH:-./isos}
        target: /isos
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health', timeout=4)"]
      interval: 30s
      start_period: 5s
      start_interval: 1s
      timeout: 5s
      retries: 3
secrets:
  app_password:
    file: ./.env.admin
volumes:
  proxmate-data:

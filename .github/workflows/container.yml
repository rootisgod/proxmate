name: Container checks and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::Use a stable version tag such as v0.6.0"; exit 1;
          }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Test backend and dashboard
        run: |
          python -m pip install -r requirements.txt pytest
          npm ci
          npm run build:editor
          npm test
          python -m pytest -q
      - name: Build the distribution image
        run: |
          version=source
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version="$GITHUB_REF_NAME"; fi
          docker build --platform linux/amd64 \
            --build-arg "PROXMATE_VERSION=$version" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$GITHUB_REF_NAME" \
            --tag proxmate-ci:checked .
      - name: Check the image and a fresh Compose installation
        run: |
          docker run --rm --network none --volume "$PWD/tests:/tests:ro" proxmate-ci:checked python /tests/container_check.py
          docker run --rm --network none --user 0 --volume "$PWD/tests:/tests:ro" --volume "$PWD/scripts:/scripts:ro" \
            proxmate-ci:checked bash /tests/lxc_install_check.sh /scripts/install-proxmox-lxc.sh
          python tests/release_install.py proxmate-ci:checked
          sudo bash tests/release_update_check.sh proxmate-ci:checked
      - name: Export the exact tested image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker tag proxmate-ci:checked "proxmate-bundle:$GITHUB_REF_NAME"
          docker save "proxmate-bundle:$GITHUB_REF_NAME" | gzip -1 > "$RUNNER_TEMP/proxmate.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: tested-image
          path: ${{ runner.temp }}/proxmate.tar.gz
          compression-level: 0
          retention-days: 1

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-image
          path: ${{ runner.temp }}
      - name: Publish image and installation files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release already exists for $GITHUB_REF_NAME. Use a new version for changes."; exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          docker load --input "$RUNNER_TEMP/proxmate.tar.gz"
          docker tag "proxmate-bundle:$GITHUB_REF_NAME" proxmate-ci:checked
          test "$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' proxmate-ci:checked)" = "$GITHUB_SHA"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag proxmate-ci:checked "$image:$version"
          docker push "$image:$version"
          digest=$(docker inspect -f '{{range .RepoDigests}}{{println .}}{{end}}' "$image:$version" | sed -n "s|^$image@||p")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          ref="$image:$version@$digest"
          docker pull "$ref"
          sed "s|^    image: .*|    image: $ref|" compose.release.yaml > "$RUNNER_TEMP/compose.yaml"
          test "$(docker compose -f "$RUNNER_TEMP/compose.yaml" config --images)" = "$ref"
          mv "$RUNNER_TEMP/proxmate.tar.gz" "$RUNNER_TEMP/proxmate-linux-amd64.tar.gz"
          archive_sha=$(sha256sum "$RUNNER_TEMP/proxmate-linux-amd64.tar.gz" | cut -d' ' -f1)
          sed -e "s/^release_tag=source$/release_tag=$GITHUB_REF_NAME/" \
            -e "s/^archive_sha=unpublished$/archive_sha=$archive_sha/" \
            -e "s/^revision=unpublished$/revision=$GITHUB_SHA/" \
            scripts/install-proxmox-lxc.sh > "$RUNNER_TEMP/install-proxmox-lxc.sh"
          bash -n "$RUNNER_TEMP/install-proxmox-lxc.sh"
          notes="$RUNNER_TEMP/release-notes.md"
          if [[ -f "docs/releases/$GITHUB_REF_NAME.md" ]]; then cat "docs/releases/$GITHUB_REF_NAME.md" > "$notes"; fi
          printf '\n[Install or update Proxmate](https://github.com/%s/blob/%s/README.md)\n\nLinux amd64 image: `%s`\n\nRelease archive SHA-256: `%s`\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$ref" "$archive_sha" >> "$notes"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Proxmate $version" --generate-notes \
            --notes-file "$notes" \
            "$RUNNER_TEMP/compose.yaml" docs/install-proxmox-lxc.md "$RUNNER_TEMP/install-proxmox-lxc.sh" "$RUNNER_TEMP/proxmate-linux-amd64.tar.gz"
